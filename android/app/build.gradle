apply plugin: 'com.android.application'

def signingNames = ['COOLER_KEYSTORE_PATH', 'COOLER_KEYSTORE_PASSWORD', 'COOLER_KEY_ALIAS', 'COOLER_KEY_PASSWORD']
def signingValues = signingNames.collect { System.getenv(it) }
def hasUploadKey = signingValues.every { it != null && !it.isBlank() }

android {
    namespace = "io.github.gumbrich.coolerwalks"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.gumbrich.coolerwalks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "0.14.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile file(System.getenv('COOLER_KEYSTORE_PATH'))
                storePassword System.getenv('COOLER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('COOLER_KEY_ALIAS')
                keyPassword System.getenv('COOLER_KEY_PASSWORD')
            }
        }
    }
    if (hasUploadKey && !project.hasProperty('coolerUnsigned')) {
        buildTypes.release.signingConfig = signingConfigs.upload
    }
}

// Never accidentally sign a release with the development key or serve a dev URL.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!project.hasProperty('coolerUnsigned') && !hasUploadKey) {
                throw new GradleException('Release signing needs all four COOLER_KEY* environment variables. Use the explicit unsigned preparation command for local validation.')
            }
            def cap = new groovy.json.JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
            if (System.getenv('COOLER_DEV_DOWNLOADS') == '1' || cap.server?.url || cap.server?.cleartext || cap.android?.allowMixedContent) {
                throw new GradleException('Development network settings are forbidden in release builds. Run native:sync without COOLER_DEV_DOWNLOADS.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
