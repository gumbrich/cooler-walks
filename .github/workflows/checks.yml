name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          python3 -m venv /tmp/cooler-counts-venv
          /tmp/cooler-counts-venv/bin/pip install -r scripts/requirements-counts.txt
          /tmp/cooler-counts-venv/bin/python scripts/test-vehicle-counts.py
      - run: |
          python3 -m venv /tmp/cooler-shade-venv
          /tmp/cooler-shade-venv/bin/pip install -r scripts/requirements-shade.txt
          /tmp/cooler-shade-venv/bin/python scripts/test-detailed-shade.py
      - run: npm run check
      - run: npm run data:verify
      - run: npm run format:check
      - run: npm run build
  browser:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every scenario still runs, with the same assertion and flow limits.
      # Isolated runners avoid competing over WebGL and screenshot artifacts.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: docs/screenshots/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
