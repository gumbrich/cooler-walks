name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload files (requires available GitHub artifact storage)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          python3 -m venv /tmp/cooler-counts-venv
          /tmp/cooler-counts-venv/bin/pip install -r scripts/requirements-counts.txt
          /tmp/cooler-counts-venv/bin/python scripts/test-vehicle-counts.py
      - run: |
          python3 -m venv /tmp/cooler-shade-venv
          /tmp/cooler-shade-venv/bin/pip install -r scripts/requirements-validation.txt
          /tmp/cooler-shade-venv/bin/python scripts/test-detailed-shade.py
          /tmp/cooler-shade-venv/bin/python scripts/test-shadow-audit.py
          /tmp/cooler-shade-venv/bin/python scripts/test-shadow-lidar-review.py
      - run: npm run check
      - run: npm run data:verify
      - run: npm run format:check
      - run: npm run build
  browser:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      # Every scenario still runs, with the same assertion and flow limits.
      # Isolated runners avoid competing over WebGL and screenshot artifacts.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Verify production cache upgrades
        if: matrix.shard == 1
        run: npm run build && npm run test:pwa:upgrade
      - name: Print failure context without artifact storage
        if: failure()
        run: node scripts/ci-failure-context.mjs
      - uses: actions/upload-artifact@v7
        if: always() && inputs.upload_artifacts
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: test-results/
          retention-days: 3
