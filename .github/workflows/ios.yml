name: Native iOS build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload files (requires available GitHub artifact storage)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run native:sync
      - run: npm run native:ios
      - run: npm run native:archive:unsigned
      - run: ditto -c -k --keepParent native-artifacts/CoolerWalks-unsigned.xcarchive cooler-walks-ios-unsigned-archive.zip
      - run: ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app cooler-walks-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts
        with:
          name: cooler-walks-ios-simulator
          path: cooler-walks-ios-simulator.zip
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifacts
        with:
          name: cooler-walks-ios-unsigned-archive
          path: cooler-walks-ios-unsigned-archive.zip
          retention-days: 3
